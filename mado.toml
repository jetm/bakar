[lint]
# Three markdown files here are symlinks OUT of the repository, into devtool:
#   ARCHITECTURE.md         -> devtool/claude/architecture/bakar.md
#   CLAUDE.md               -> devtool/generated/CLAUDE-bakar.md (generated)
#   .claude/rules/python.md -> devtool/claude/rules/python.md (a shared rule)
#
# A finding introduced on devtool's side would otherwise block a commit here
# against a file this repo cannot fix, and "fixing" it would mean editing
# another repository through a link.
#
# All three are already gitignored, and mado honours .gitignore, so none of
# these entries changes the result today. They stay because that behaviour is
# unsettled upstream - akiomik/mado#346 is open on whether .gitignore should
# apply without a real git repository - and because a run over an export or a
# git-less checkout would see them with nothing else to stop it.
#
# There is no generated/ directory in this repository, so no entry for one. That
# pattern was carried over from devtool, which does have the directory and needs
# it; here it named a path that does not exist.
exclude = [
  "ARCHITECTURE.md",
  "CLAUDE.md",
  ".claude/rules/python.md",
]
rules = [
  "MD001",
  "MD003",
  "MD004",
  "MD009",
  "MD012",
  "MD014",
  "MD018",
  "MD019",
  "MD020",
  "MD021",
  "MD023",
  "MD024",
  "MD025",
  "MD026",
  "MD027",
  "MD028",
  "MD029",
  "MD033",
  "MD034",
  "MD035",
  "MD037",
  "MD038",
  "MD039",
  "MD040",
  "MD046",
  "MD047",
]

# MD002/MD005/MD006/MD007/MD010/MD030 dropped: mado bugs/false positives.
#   MD010 has no code_blocks=false option.
#   MD030 fires on every two-digit ordered marker. A file whose whole content is
#   "10. **Ten**" - one space after the marker - is reported, while the same item
#   numbered "9." passes. Nothing here triggers it yet, which is the reason to
#   drop it now: the finding arrives the first time a doc reaches a tenth
#   numbered step, as a block with nothing to fix and no inline suppression.
#   THIS ONE EXPIRES. Fixed upstream by akiomik/mado#363, merged 2026-08-05,
#   after the 0.3.1 release we run - the fix exists and has simply not shipped.
#   Re-enable MD030 on the first release past 0.3.1 rather than leaving it here
#   to read as a permanent verdict on the rule.
# MD013/MD022/MD031/MD032/MD036/MD041 dropped: intentional style (see markdown.md)
#
# MD038 stays ENABLED, with one known false positive (akiomik/mado#391): any
# code span delimited by two or more backticks is reported even with no padding,
# so a span that must CONTAIN a backtick cannot satisfy it. Write those as a
# single span with no inner backticks. The rule is worth keeping regardless - it
# catches spans split across a line break, which render the newline as a space
# and corrupt quoted command output.

# MD009 stays enabled here, unlike in devtool and devspec. It was dropped there
# for the trailing space in RFC 3676 "-- " signature delimiters inside
# email-reply templates; this repo has no such templates, so the rule is doing
# real work rather than misfiring.

[lint.md024]
allow-different-nesting = true

[lint.md026]
punctuation = ".,;:!"

[lint.md029]
style = "ordered"
