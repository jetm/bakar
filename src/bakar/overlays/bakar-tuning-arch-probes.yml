# Arch-host native-probe containment overlay.
#
# Never auto-loaded; bakar appends it only when all three of these hold (see
# _arch_probe_extra_overlays in commands/_helpers.py):
#
#   - uninative is enabled,
#   - the build runs in host mode,
#   - the host is Arch Linux or an Arch derivative.
#
# What it does: pre-seeds the configure probes that OE native recipes run
# against the *host* rather than recipe-sysroot-native.
#
# Arch-family distros ship development headers in the base system that
# Debian-family hosts keep in separate -dev packages. cmake-native builds a
# bundled cmcurl whose CMakeLists runs check_library_exists(idn2 ...), and that
# check searches the default linker path - not the native sysroot. On Arch it
# succeeds against /usr/lib/libidn2.so.0, so -lidn2 lands on the link line of
# five targets including cmake itself. Nothing stages libidn2 into
# recipe-sysroot-native, so the binary's RUNPATH never covers it and the
# freshly built bin/cmake cannot start under the uninative loader:
#
#   bin/cmake: error while loading shared libraries: libidn2.so.0
#
# do_install then dies with exit 127 behind an opaque "oe_runmake failed".
#
# Both variables are required. check_library_exists runs independently of the
# feature switch, so -DUSE_LIBIDN2=0 alone leaves HAVE_LIBIDN2=1 in the cache
# and -lidn2 on the link line; pre-seeding the HAVE_ vars makes the check skip
# entirely. This is exactly how oe-core already contains a sibling cmcurl probe
# in the same recipe - -DENABLE_ACL=0 -DHAVE_ACL_LIBACL_H=0 -DHAVE_SYS_ACL_H=0,
# and how it contains e2fsprogs for the reason its own comment gives: "Ensure
# e2fsprogs isn't found on the host to remove a build dependency and
# reproducible builds." libidn2 is one upstream missed, because their build
# hosts do not ship idn2.h.
#
# nghttp2 is another, and it is NOT handled here: oe-core carries no
# USE_NGHTTP2 containment at wrynose (recipes-devtools/cmake/cmake/ holds only
# cmake-setup.py, environment.d-cmake.sh and the two toolchain templates), so
# a host with the nghttp2 headers fails do_compile on nghttp2/nghttp2.h before
# it ever reaches the libidn2 link. That one is contained unconditionally in
# meta-avocado-distro rather than here, because any host carrying the headers
# hits it - the failure is a missing include path, not a uninative loader
# mismatch, so it does not depend on this overlay's Arch+uninative gate.
#
# Why this rides on the uninative toggle rather than its own: a leaked host
# library is only fatal because uninative swapped the program interpreter. The
# uninative loader searches RUNPATH and its own sysroot and never the host's
# default paths, so it refuses a /usr/lib library the host loader would have
# resolved silently. Enabling uninative on an Arch host is precisely what turns
# these probe leaks into build failures, so the containment shares that switch.
#
# Signature consequence, accepted deliberately: appending to EXTRA_OECMAKE
# changes cmake-native's task signature, so an Arch host and a Debian host no
# longer share sstate for cmake-native or anything downstream of it. Keeping
# the gate on an explicit toggle bounds that divergence to builds that opted
# into uninative, so the tuning stack never varies with the machine alone.
#
# Adds no layer, so there is no repos entry - only a local_conf_header.

header:
  version: 21

local_conf_header:
  # Sort-last key (see bakar-tuning-generic): 80 orders these host-probe
  # containments after uninative (70), which is the overlay that decides which
  # loader the resulting native binaries run under in the first place.
  zz-bakar-80-arch-probes: |
    EXTRA_OECMAKE:append:pn-cmake-native = " -DUSE_LIBIDN2=0 -DHAVE_LIBIDN2=0 -DHAVE_IDN2_H=0"
